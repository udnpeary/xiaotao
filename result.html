<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>命理小卡</title>
  <!-- html2canvas 用於截圖 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: #f5f0f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
      padding: 20px;
    }

    /* ===== 3:4 卡片（要截圖的區塊） ===== */
    #card {
      width: 360px;
      aspect-ratio: 3 / 4;
      background: linear-gradient(145deg, #ffffff, #faf5f7);
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      border: 1px solid #f0e8ea;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    /* 背景裝飾 */
    #card::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #fce4ec 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0.4;
    }
    #card::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: -60px;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, #e8d5f0 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0.3;
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: #c94a7a;
      letter-spacing: 4px;
      text-align: center;
      border-bottom: 2px solid #fce4ec;
      padding-bottom: 12px;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }
    .card-subtitle {
      font-size: 12px;
      color: #b097a0;
      letter-spacing: 2px;
      text-align: center;
      margin-top: -8px;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .card-bazi {
      background: #f8f4f6;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: center;
      margin-bottom: 14px;
      border: 1px solid #f0e8ea;
      position: relative;
      z-index: 1;
    }
    .card-bazi-label {
      font-size: 10px;
      color: #b097a0;
      letter-spacing: 2px;
    }
    .card-bazi-text {
      font-size: 18px;
      font-weight: 600;
      color: #3a2c33;
      letter-spacing: 4px;
      font-family: 'PingFang TC', 'Helvetica Neue', sans-serif;
    }
    .card-bazi-daymaster {
      font-size: 12px;
      color: #b097a0;
    }
    .card-bazi-daymaster strong {
      color: #c94a7a;
    }

    .card-title-nick {
      font-size: 13px;
      color: #b097a0;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 2px;
      position: relative;
      z-index: 1;
    }
    .card-nickname {
      font-size: 28px;
      font-weight: 700;
      color: #c94a7a;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .card-story {
      flex: 1;
      background: #fffafb;
      border-radius: 12px;
      padding: 14px 16px;
      border-left: 4px solid #c94a7a;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
      min-height: 80px;
    }
    .card-story-label {
      font-size: 10px;
      color: #b097a0;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .card-story-text {
      font-size: 14px;
      color: #3a2c33;
      line-height: 1.7;
    }

    .card-crystal {
      background: #f0f4fa;
      border-radius: 12px;
      padding: 12px 16px;
      border-left: 4px solid #6a8cba;
      position: relative;
      z-index: 1;
      margin-bottom: 10px;
    }
    .card-crystal-label {
      font-size: 10px;
      color: #6a7a8a;
      letter-spacing: 2px;
    }
    .card-crystal-text {
      font-size: 14px;
      color: #2a3a4a;
      line-height: 1.5;
    }

    .card-footer {
      text-align: center;
      font-size: 10px;
      color: #b097a0;
      letter-spacing: 2px;
      border-top: 1px solid #f3e8ea;
      padding-top: 10px;
      position: relative;
      z-index: 1;
      margin-top: auto;
    }

    /* ===== 按鈕區 ===== */
    .btn-area {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 360px;
      max-width: 100%;
    }
    .btn-download {
      background: #c94a7a;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 2px;
    }
    .btn-download:hover {
      background: #b03a6a;
    }
    .btn-download:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .btn-back {
      background: #86868b;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 1px;
    }
    .btn-back:hover {
      background: #6e6e73;
    }

    .loading-text {
      text-align: center;
      color: #86868b;
      font-size: 16px;
      padding: 40px 0;
    }
    .error-text {
      text-align: center;
      color: #c94a7a;
      font-size: 16px;
      padding: 40px 0;
    }

    /* ===== 手機優化 ===== */
    @media (max-width: 420px) {
      #card {
        width: 100%;
        max-width: 360px;
        padding: 20px 16px;
        border-radius: 24px;
      }
      .card-bazi-text {
        font-size: 16px;
        letter-spacing: 3px;
      }
      .card-nickname {
        font-size: 24px;
      }
      .card-story-text {
        font-size: 13px;
      }
      .card-crystal-text {
        font-size: 13px;
      }
      .btn-area {
        width: 100%;
        max-width: 360px;
      }
    }
  </style>
</head>
<body>

  <!-- 卡片 -->
  <div id="card">
    <div class="card-title">✦ 小桃說好命 ✦</div>
    <div class="card-subtitle">八字命盤・人生故事</div>

    <div class="card-bazi">
      <div class="card-bazi-label">📜 八字命盤</div>
      <div class="card-bazi-text" id="displayBazi">—</div>
      <div class="card-bazi-daymaster">日主：<strong id="displayDayMaster">—</strong></div>
    </div>

    <div class="card-title-nick">✦ 你的江湖稱號 ✦</div>
    <div class="card-nickname" id="displayTitle">—</div>

    <div class="card-story">
      <div class="card-story-label">📖 你的人生故事</div>
      <div class="card-story-text" id="displayStory">—</div>
    </div>

    <div class="card-crystal">
      <div class="card-crystal-label">💎 你的五行水晶</div>
      <div class="card-crystal-text" id="displayCrystal">—</div>
    </div>

    <div class="card-footer">— 僅供參考 · 小桃說好命 —</div>
  </div>

  <!-- 按鈕區 -->
  <div class="btn-area">
    <button class="btn-download" id="downloadBtn">⬇ 下載命理小卡</button>
    <button class="btn-back" id="backBtn">← 返回首頁</button>
  </div>

  <script>
    // ===== 從 URL 獲取 ID =====
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    const displayBazi = document.getElementById('displayBazi');
    const displayDayMaster = document.getElementById('displayDayMaster');
    const displayTitle = document.getElementById('displayTitle');
    const displayStory = document.getElementById('displayStory');
    const displayCrystal = document.getElementById('displayCrystal');
    const downloadBtn = document.getElementById('downloadBtn');
    const backBtn = document.getElementById('backBtn');

    let resultData = null;

    // ===== 載入結果 =====
    async function loadResult() {
      if (!id) {
        document.getElementById('card').innerHTML = '<div class="error-text">❌ 無效的命盤連結</div>';
        downloadBtn.disabled = true;
        return;
      }

      try {
        const res = await fetch(`/api/result/${id}`);
        if (!res.ok) throw new Error('找不到結果');
        resultData = await res.json();

        // 填入數據
        displayBazi.textContent = resultData.bazi?.full || '—';
        displayDayMaster.textContent = resultData.dayMaster || '—';
        displayTitle.textContent = resultData.title || '無名俠客';
        displayStory.textContent = resultData.lifeStory || '你是個獨特的人，擁有無限可能。';
        displayCrystal.textContent = resultData.crystal || '粉晶，為你帶來溫柔的能量。';

        downloadBtn.disabled = false;

      } catch (error) {
        document.getElementById('card').innerHTML = '<div class="error-text">❌ 命盤已過期或不存在</div>';
        downloadBtn.disabled = true;
      }
    }

    // ===== 下載圖片 =====
    async function downloadCard() {
      const card = document.getElementById('card');
      downloadBtn.disabled = true;
      downloadBtn.textContent = '⏳ 生成中...';

      try {
        // 等待渲染完成
        await new Promise(r => setTimeout(r, 300));

        const canvas = await html2canvas(card, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false,
          width: 360,
          height: 480,
          onclone: (clonedDoc) => {
            // 確保克隆的卡片樣式正確
          }
        });

        // 下載
        const link = document.createElement('a');
        link.download = `命理小卡_${resultData?.title || '小桃說好命'}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();

      } catch (error) {
        console.error('生成圖片失敗：', error);
        alert('圖片生成失敗，請重試或截圖保存');
      }

      downloadBtn.disabled = false;
      downloadBtn.textContent = '⬇ 下載命理小卡';
    }

    // ===== 返回首頁 =====
    backBtn.addEventListener('click', () => {
      window.location.href = '/';
    });

    downloadBtn.addEventListener('click', downloadCard);

    // ===== 載入 =====
    loadResult();
  </script>

</body>
</html>
