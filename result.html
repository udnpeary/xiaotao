<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>命理小卡</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: #f5f0f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
      padding: 16px;
    }

    #card {
      width: 340px;
      aspect-ratio: 3 / 4;
      background: linear-gradient(150deg, #ffffff, #f8f4f6);
      border-radius: 28px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.10);
      padding: 28px 22px 20px;
      display: flex;
      flex-direction: column;
      border: 1px solid #f0e8ea;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    #card::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, #fce4ec 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0.35;
    }
    #card::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: -40px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, #e8d5f0 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0.25;
    }

    .card-header {
      text-align: center;
      border-bottom: 2px solid #fce4ec;
      padding-bottom: 10px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }
    .card-header .brand {
      font-size: 18px;
      font-weight: 700;
      color: #c94a7a;
      letter-spacing: 4px;
    }
    .card-header .sub {
      font-size: 10px;
      color: #b097a0;
      letter-spacing: 2px;
    }

    /* 八字四柱 - 分開顯示 */
    .card-bazi {
      text-align: center;
      background: #f8f4f6;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 1px solid #f0e8ea;
      position: relative;
      z-index: 1;
    }
    .card-bazi .label {
      font-size: 10px;
      color: #b097a0;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .card-bazi .pillars {
      display: flex;
      justify-content: space-around;
      gap: 4px;
    }
    .card-bazi .pillar-item {
      text-align: center;
    }
    .card-bazi .pillar-item .p-label {
      font-size: 9px;
      color: #b097a0;
      letter-spacing: 1px;
    }
    .card-bazi .pillar-item .p-value {
      font-size: 18px;
      font-weight: 700;
      color: #3a2c33;
      letter-spacing: 1px;
      font-family: 'PingFang TC', 'Helvetica Neue', sans-serif;
    }

    .card-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #c94a7a;
      letter-spacing: 2px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }
    .card-title .small {
      font-size: 10px;
      color: #b097a0;
      font-weight: 400;
      letter-spacing: 2px;
      display: block;
    }

    .card-scores {
      display: flex;
      justify-content: space-around;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
      flex: 1;
      align-items: center;
    }
    .card-scores .s-item {
      text-align: center;
    }
    .card-scores .s-item .num {
      font-size: 28px;
      font-weight: 700;
      color: #c94a7a;
      line-height: 1.2;
    }
    .card-scores .s-item .label {
      font-size: 11px;
      color: #b097a0;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .card-crystal {
      font-size: 14px;
      color: #2a3a4a;
      background: #f0f4fa;
      border-radius: 10px;
      padding: 10px 14px;
      border-left: 4px solid #6a8cba;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }
    .card-crystal .clabel {
      font-size: 10px;
      color: #6a7a8a;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .card-footer {
      text-align: center;
      font-size: 9px;
      color: #b097a0;
      letter-spacing: 2px;
      border-top: 1px solid #f3e8ea;
      padding-top: 8px;
      margin-top: auto;
      position: relative;
      z-index: 1;
    }

    .btn-area {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 340px;
      max-width: 100%;
    }
    .btn-download {
      background: #c94a7a;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 2px;
    }
    .btn-download:hover {
      background: #b03a6a;
    }
    .btn-download:disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    .btn-back {
      background: #86868b;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 1px;
    }
    .btn-back:hover {
      background: #6e6e73;
    }

    .loading {
      text-align: center;
      color: #86868b;
      font-size: 15px;
      padding: 30px 0;
    }
    .error {
      text-align: center;
      color: #c94a7a;
      font-size: 15px;
      padding: 30px 0;
    }

    @media (max-width: 400px) {
      #card {
        width: 100%;
        max-width: 340px;
        padding: 20px 16px 16px;
        border-radius: 20px;
      }
      .card-bazi .pillar-item .p-value {
        font-size: 16px;
      }
      .card-title {
        font-size: 20px;
      }
      .card-scores .s-item .num {
        font-size: 24px;
      }
      .btn-area {
        width: 100%;
        max-width: 340px;
      }
    }
  </style>
</head>
<body>

  <div id="card">
    <div class="card-header">
      <div class="brand">✦ 小桃說好命 ✦</div>
      <div class="sub">八字命盤・運勢分數</div>
    </div>

    <!-- 八字四柱：分開顯示 -->
    <div class="card-bazi">
      <div class="label">📜 八字命盤</div>
      <div class="pillars">
        <div class="pillar-item">
          <div class="p-label">年柱</div>
          <div class="p-value" id="displayYear">—</div>
        </div>
        <div class="pillar-item">
          <div class="p-label">月柱</div>
          <div class="p-value" id="displayMonth">—</div>
        </div>
        <div class="pillar-item">
          <div class="p-label">日柱</div>
          <div class="p-value" id="displayDay">—</div>
        </div>
        <div class="pillar-item">
          <div class="p-label">時柱</div>
          <div class="p-value" id="displayHour">—</div>
        </div>
      </div>
    </div>

    <div class="card-title">
      <span class="small">✦ 你的江湖稱號 ✦</span>
      <span id="displayTitle">—</span>
    </div>

    <div class="card-scores">
      <div class="s-item">
        <div class="num" id="displayWealth">—</div>
        <div class="label">💰 財運</div>
      </div>
      <div class="s-item">
        <div class="num" id="displayCareer">—</div>
        <div class="label">💼 事業</div>
      </div>
      <div class="s-item">
        <div class="num" id="displayLove">—</div>
        <div class="label">❤️ 感情</div>
      </div>
    </div>

    <div class="card-crystal">
      <div class="clabel">💎 適合水晶</div>
      <span id="displayCrystal">—</span>
    </div>

    <div class="card-footer">— 僅供參考 · 小桃說好命 —</div>
  </div>

  <div class="btn-area">
    <button class="btn-download" id="downloadBtn" disabled>⬇ 下載命理小卡</button>
    <button class="btn-back" id="backBtn">← 返回首頁</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    const displayYear = document.getElementById('displayYear');
    const displayMonth = document.getElementById('displayMonth');
    const displayDay = document.getElementById('displayDay');
    const displayHour = document.getElementById('displayHour');
    const displayTitle = document.getElementById('displayTitle');
    const displayWealth = document.getElementById('displayWealth');
    const displayCareer = document.getElementById('displayCareer');
    const displayLove = document.getElementById('displayLove');
    const displayCrystal = document.getElementById('displayCrystal');
    const downloadBtn = document.getElementById('downloadBtn');
    const backBtn = document.getElementById('backBtn');

    let resultData = null;

    async function loadResult() {
      if (!id) {
        document.getElementById('card').innerHTML = '<div class="error">❌ 無效的命盤連結</div>';
        downloadBtn.disabled = true;
        return;
      }
      try {
        const res = await fetch(`/api/result/${id}`);
        if (!res.ok) throw new Error('找不到結果');
        resultData = await res.json();

        // 顯示完整四柱（分開）
        const b = resultData.bazi || {};
        displayYear.textContent = b.year || '—';
        displayMonth.textContent = b.month || '—';
        displayDay.textContent = b.day || '—';
        displayHour.textContent = b.hour || '—';

        displayTitle.textContent = resultData.title || '無名俠客';
        displayWealth.textContent = resultData.wealthScore ?? '—';
        displayCareer.textContent = resultData.careerScore ?? '—';
        displayLove.textContent = resultData.loveScore ?? '—';
        displayCrystal.textContent = resultData.crystal || '粉晶';

        downloadBtn.disabled = false;
      } catch (error) {
        document.getElementById('card').innerHTML = '<div class="error">❌ 命盤已過期或不存在</div>';
        downloadBtn.disabled = true;
      }
    }

    async function downloadCard() {
      const card = document.getElementById('card');
      downloadBtn.disabled = true;
      downloadBtn.textContent = '⏳ 生成中...';
      try {
        await new Promise(r => setTimeout(r, 200));
        const canvas = await html2canvas(card, {
          scale: 2.5,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false,
          width: 340,
          height: 453,
        });
        const link = document.createElement('a');
        link.download = `命理小卡_${resultData?.title || '小桃說好命'}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (error) {
        console.error('生成圖片失敗：', error);
        alert('圖片生成失敗，請截圖保存');
      }
      downloadBtn.disabled = false;
      downloadBtn.textContent = '⬇ 下載命理小卡';
    }

    backBtn.addEventListener('click', () => { window.location.href = '/'; });
    downloadBtn.addEventListener('click', downloadCard);

    loadResult();
  </script>

</body>
</html>
